# Copy this file, fill it in, and point PIPELINES_CONFIG at the copy (for example on the
# volume), or save it as config/config.yml, which git ignores. Never commit the copy.

# The store: a folder of its own inside a Unity Catalog volume. Unrestricted data only;
# H19, FEH SAAR and MOSES go to a restricted volume.
store_root: /Volumes/<catalog>/<schema>/<volume>/hydrometric

# Optional: who the register records as receiving the data (default: the run's user).
received_by: ""

# Optional lookup giving each WISKI ID a catchment. Leave lookup_csv empty to skip it.
lookup_csv: ""
lookup_id_col: ""
lookup_catchment_col: ""

trial:
  n_gauges: 3
  start_date: "2023-01-01"
  end_date: "2024-01-01"        # exclusive

backfill:
  start_date: "1900-01-01"      # earliest wanted; each gauge starts at its own first reading
  end_date: "2026-01-01"        # exclusive
  chunk_size: 50                # gauges per chunk; progress is saved after each
  years_per_request: 10         # years of readings per API request; longer is faster

incremental:
  default_start: "1900-01-01"   # for a gauge with nothing stored yet
  lookback_days: 90             # re-fetch this many days before the latest stored reading, so
                                # readings the EA revises after publishing are picked up

# HadUK-Grid (Met Office, Open Government Licence): the folder holding the 1 km daily rainfall
# NetCDF files, searched below for rainfall_hadukgrid_uk_1km_day_*.nc.
haduk:
  root: /Volumes/<catalog>/<schema>/<volume>/<haduk folder>/
  start_year: 1961              # extract from this year; 1961 covers the 1991-2020 normal

# Catchments or areas for the accumulation charts: an id, a name, and a GeoJSON outline in
# British National Grid metres (EPSG:27700).
areas: []
#  - id: beggearn_huish
#    name: Beggearn Huish
#    geojson: /Volumes/<catalog>/<schema>/<volume>/outlines/beggearn_huish.geojson

accumulation:
  normal_start: 1991            # the mean line's period
  normal_end: 2020
  min_years: 20                 # fewer complete years at a gauge: use HadUK-Grid at its cell
  min_complete: 0.95            # share of a day's 96 readings needed for the day to count

# Quality control, stage 1 (single gauge). Every setting is optional; these are the defaults,
# provisional until checked against Lewis et al. (2018, 2021).
qc:
  suspect_15min_mm: 40.0
  reject_15min_mm: 100.0
  suspect_day_mm: 200.0
  reject_day_mm: 400.0
  repeat_runs: [[1.0, 8], [0.2, 48]]   # [mm, readings in a row]: 1 mm for 2 h, any for 12 h
  accumulation_mm: 5.0
  accumulation_gap_h: 24.0
  use_ea_suspect: true
  hour_share_max: 0.2
  weekend_ratio_range: [0.5, 1.5]
  min_wet_readings: 200             # judge hour and weekend patterns only with this many
  # Stage 3: SAAR by gauge for the long-term check, a CSV of gauge_id and saar_mm. SAAR is
  # restricted: the file must sit on a restricted volume. Empty: compare with HadUK-Grid only.
  saar_csv: ""

